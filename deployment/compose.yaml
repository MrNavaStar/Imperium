services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.125.1@sha256:38198abbda1b55da7a7f37a7924b2ccdcc0583bd24466b7c2103ef6cd2ffc828
    restart: unless-stopped
    depends_on:
      bitwarden-api:
        condition: service_healthy
    environment:
      TZ: America/Edmonton
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: auto
      POLL_CONFIG: |
        - url: https://github.com/MrNavaStar/Imperium.git
          reference: master
          interval: 120
      SECRET_PROVIDER: webhook
      SECRET_PROVIDER_WEBHOOK_STORES_FILE: /secret-store.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - ./secret-store.yaml:/secret-store.yml:ro

  bitwarden-api:
    image: ghcr.io/kimdre/bitwarden-rest-api-server:latest
    environment:
      - BW_HOST=${BW_HOST:-https://vault.bitwarden.com}
      - BW_CLIENTID=${BW_CLIENTID:?error}
      - BW_CLIENTSECRET=${BW_CLIENTSECRET:?error}
      - BW_PASSWORD=${BW_PASSWORD:?error}
    ports:
      - "8087:8087"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /data:uid=65532,gid=65532,mode=755

volumes:
  data:
