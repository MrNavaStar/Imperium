services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.125.1@sha256:38198abbda1b55da7a7f37a7924b2ccdcc0583bd24466b7c2103ef6cd2ffc828
    restart: unless-stopped
    depends_on:
      bitwarden-api:
        condition: service_healthy
    environment:
      TZ: America/Edmonton
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: auto
      POLL_CONFIG: |
        - url: https://github.com/MrNavaStar/Imperium.git
          reference: master
          interval: 120
      SECRET_PROVIDER: webhook
      SECRET_PROVIDER_WEBHOOK_STORES_FILE: /secret-store.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - ./secret-store.yaml:/secret-store.yml:ro
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  vaultwarden:
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "true"
    volumes:
      - vaultwarden-data:/data
    ports:
      - "8082:80"

  bitwarden-api:
    image: ghcr.io/kimdre/bitwarden-rest-api-server:latest
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_started
      set_permissions:
        condition: service_completed_successfully
    init: true
    read_only: true
    environment:
      BW_HOST: http://vaultwarden:80
      BW_CLIENTID: ${BW_CLIENTID:?Set BW_CLIENTID in .env}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:?Set BW_CLIENTSECRET in .env}
      BW_PASSWORD: ${BW_PASSWORD:?Set BW_PASSWORD in .env}
    expose:
      - "8087"
    cap_drop:
      - ALL
    volumes:
      - bw-data:/data

  set_permissions:
    image: busybox:latest
    restart: "no"
    command: sh -c "chown -R 65532:65532 /data"
    volumes:
      - bw-data:/data

volumes:
  data:
  vaultwarden-data:
  bw-data:
