# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
#
# Key behaviour:
#   • remove_orphans: true  → containers/services NOT in the compose file are
#                             stopped and removed after every deploy.
#   • timeout: 120          → generous default so slow services can finish.
#
# Multiple deployment targets (different machines) are supported via:
#   1. The `context` field on any stack — points to a named Docker context
#      (e.g. `context: remote-server` for a SSH context on another machine).
#   2. Separate config files per target — deploy to `deployment.<target>.yml`
#      and send webhooks to `/v1/webhook/<target>`.
#
# See: https://doco.cd/latest/Deploy-Settings/#multiple-deployment-targets

# ────────────────────────────────────────────────────────────── deployment ──────────────────────────────────────────────────────────────
name: deployment
working_dir: deployment
compose_files: [compose.yaml]
remove_orphans: true
timeout: 120
external_secrets:
  BW_HOST:
    store_ref: bitwarden-login
    remote_ref:
      key: 98487473-23ca-4a16-8d56-ed110554bbfa
      property: username
  BW_PASSWORD:
    store_ref: bitwarden-login
    remote_ref:
      key: 98487473-23ca-4a16-8d56-ed110554bbfa
      property: password
  BW_CLIENTID:
    store_ref: bitwarden-login
    remote_ref:
      key: 66569b57-628a-4bed-8030-0fb470480698
      property: username
  BW_CLIENTSECRET:
    store_ref: bitwarden-login
    remote_ref:
      key: 66569b57-628a-4bed-8030-0fb470480698
      property: password

---
# ─────────────────────────────── unifi-controller ───────────────────────────────
name: unifi-controller
working_dir: services/network/unifi
compose_files: [compose.yaml]
remove_orphans: true
timeout: 120

---
# ─────────────────────────────── home-assistant ───────────────────────────────
name: home-assistant
working_dir: services/automation/home
compose_files: [compose.yaml]
remove_orphans: true
timeout: 120

---
# ─────────────────────────────── mmsgate2 ───────────────────────────────
name: mmsgate2
working_dir: services/voip/mmsgate2
compose_files: [compose.yaml]
remove_orphans: true
timeout: 120
